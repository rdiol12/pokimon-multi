name: Build game

# Runs only when started by hand: Actions > Build game > Run workflow. Each
# run builds the ROM and publishes a GitHub release with a BPS patch for
# Pokémon Emerald (USA) and the mGBA bridge script, plus the phone apps
# (an Android .apk and an unsigned iOS .ipa, mobile/README.md) with that
# patch inside. The ROM itself is never published.
on:
  workflow_dispatch:
    inputs:
      server_host:
        description: "Server JOIN ONLINE connects to (blank: keep include/config/netplay.h)"
        required: false
        default: ""
      server_port:
        description: "Server game port"
        required: false
        default: "7777"
      version:
        description: "Release name, e.g. v0.3 (each run publishes a GitHub release)"
        required: true
      run_tests:
        description: "Also run the test suite (slow)"
        type: boolean
        default: false
      phone_apps:
        description: "Also build the Android and iOS apps"
        type: boolean
        default: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Set the server address
        if: ${{ inputs.server_host != '' }}
        env:
          SERVER_HOST: ${{ inputs.server_host }}
          SERVER_PORT: ${{ inputs.server_port }}
        run: |
          python3 - <<'PY'
          import os, re
          host, port = os.environ["SERVER_HOST"], os.environ["SERVER_PORT"]
          if not re.fullmatch(r"[A-Za-z0-9.-]{1,39}", host) or not port.isdigit():
              raise SystemExit("server_host must be a host name or IP, server_port a number")
          path = "include/config/netplay.h"
          text = open(path).read()
          text = re.sub(r'#define NETPLAY_SERVER_HOST ".*"', f'#define NETPLAY_SERVER_HOST "{host}"', text)
          text = re.sub(r"#define NETPLAY_SERVER_PORT \d+", f"#define NETPLAY_SERVER_PORT {port}", text)
          open(path, "w").write(text)
          PY
          grep NETPLAY_SERVER include/config/netplay.h

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Build the original Emerald to patch against
        run: |
          git clone --depth 1 https://github.com/pret/agbcc ../agbcc
          git clone --depth 1 https://github.com/pret/pokeemerald ../pokeemerald
          (cd ../agbcc && ./build.sh && ./install.sh ../pokeemerald)
          make -C ../pokeemerald -j$(nproc)
          echo "f3ae088181bf583e55daf962a92bb46f4f1d07b7  ../pokeemerald/pokeemerald.gba" | sha1sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SERVER: ${{ inputs.server_host }}
        run: |
          mkdir -p release
          python3 tools/make_bps.py ../pokeemerald/pokeemerald.gba pokeemerald.gba "release/pokimon-multi-$VERSION.bps"
          cp tools/netplay_bridge/netplay_bridge.lua release/
          cat > release/notes.md <<EOF
          1. Patch your own Pokémon Emerald (USA) ROM with \`pokimon-multi-$VERSION.bps\`,
             for example on https://www.marcrobledo.com/RomPatcher.js/ or with Flips.
          2. Open the patched ROM in mGBA 0.10 or newer.
          3. Tools > Scripting... > File > Load script, and pick \`netplay_bridge.lua\`.
          4. Pick JOIN ONLINE on the title menu.

          Server: ${SERVER:-as set in include/config/netplay.h}
          EOF
          cat >> release/notes.md <<EOF

          **On a phone:** install \`pokimon-multi-$VERSION.apk\` (Android) or sign and
          install \`pokimon-multi-$VERSION.ipa\` (iOS, with AltStore or Sideloadly), then
          pick your own Emerald ROM in the app. Online play works in the app; no
          script to load. See mobile/README.md.
          EOF
          gh release create "$VERSION" release/*.bps release/netplay_bridge.lua \
            --target "$GITHUB_SHA" --title "Pokimon Multi $VERSION" --notes-file release/notes.md

      - name: Keep the patch for the phone apps
        if: ${{ inputs.phone_apps }}
        uses: actions/upload-artifact@v4
        with:
          name: patch
          path: release/*.bps
          retention-days: 1

  # The phone apps: the web app in mobile/ with this release's patch inside,
  # in an Android WebView and an iOS WKWebView.
  android:
    needs: build-emerald
    if: ${{ inputs.phone_apps }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: patch
      - name: Web app
        env:
          POKIMON_VERSION: ${{ inputs.version }}
        run: |
          cd mobile
          npm ci
          node scripts/assemble.mjs ../patch/*.bps
      - name: APK
        env:
          POKIMON_VERSION: ${{ inputs.version }}
          POKIMON_VERSION_CODE: ${{ github.run_number }}
          # Optional: a release keystore (base64) so updates install over the
          # previous version. Without it the APK is signed with a debug key.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          POKIMON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export POKIMON_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          gradle -p mobile/android assembleRelease --no-daemon
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "pokimon-multi-$VERSION.apk"
          gh release upload "$VERSION" "pokimon-multi-$VERSION.apk"

  ios:
    needs: build-emerald
    if: ${{ inputs.phone_apps }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: patch
      - name: Web app
        env:
          POKIMON_VERSION: ${{ inputs.version }}
        run: |
          cd mobile
          npm ci
          node scripts/assemble.mjs ../patch/*.bps
      - name: Unsigned IPA
        env:
          VERSION: ${{ inputs.version }}
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
          # CFBundleShortVersionString takes only digits and dots.
          MARKETING=$(echo "$VERSION" | tr -cd '0-9.' | sed 's/^\.*//; s/\.*$//')
          xcodebuild -project PokimonMulti.xcodeproj -scheme PokimonMulti -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="${MARKETING:-1.0}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PokimonMulti.app Payload/
          zip -qry "../../pokimon-multi-$VERSION.ipa" Payload
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" "pokimon-multi-$VERSION.ipa"
